name: Plugin CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        node: [22, 24]
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run validate
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-node${{ matrix.node }}-${{ matrix.os }}
          path: '*.tgz'
